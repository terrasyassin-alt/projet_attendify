<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CArdPr — Utilisateurs</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="sidebar-root"></div>
<div id="topbar-root"></div>

<!-- ADD USER MODAL -->
<div class="modal-overlay" id="modal-add">
  <div class="modal">
    <div class="modal-header">
      <h3>Ajouter un utilisateur — إضافة مستخدم</h3>
      <button class="modal-close" onclick="closeModal()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-field full">
          <label>Nom complet / الاسم الكامل</label>
          <input type="text" id="f-name" placeholder="Ex: Ahmed Benali"/>
        </div>
        <div class="form-field">
          <label>Email</label>
          <input type="email" id="f-email" placeholder="nom@ofppt.ma"/>
        </div>
        <div class="form-field">
          <label>Carte RFID</label>
          <input type="text" id="f-card" placeholder="Ex: A3F2" style="font-family:'DM Mono',monospace"/>
        </div>
        <div class="form-field">
          <label>Rôle / الدور</label>
          <select id="f-role">
            <option>Stagiaire</option>
            <option>Formateur</option>
            <option>Administrateur</option>
          </select>
        </div>
        <div class="form-field">
          <label>Groupe</label>
          <input type="text" id="f-group" placeholder="Ex: DEV101"/>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" style="flex:1" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" style="flex:2" onclick="addUser()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
        Enregistrer — حفظ
      </button>
    </div>
  </div>
</div>

<main class="main-content">
  <div class="filter-row">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input class="search-input" type="text" placeholder="Rechercher un utilisateur..." oninput="filterUsers(this.value)"/>
    </div>
    <select class="filter-select" onchange="filterUsersRole(this.value)">
      <option value="">Tous les rôles</option>
      <option value="Stagiaire">Stagiaire</option>
      <option value="Formateur">Formateur</option>
      <option value="Administrateur">Administrateur</option>
    </select>
    <button class="btn btn-primary" onclick="openModal()">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      Ajouter / إضافة
    </button>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Nom / الاسم</th>
          <th>Rôle</th>
          <th>Carte RFID</th>
          <th>Groupe</th>
          <th>Statut</th>
          <th>Actions</th>
        </tr></thead>
        <tbody id="users-table"></tbody>
      </table>
    </div>
    <div class="pagination">
      <button class="page-btn active">1</button>
      <button class="page-btn">2</button>
      <div class="page-info" id="users-count">— utilisateurs</div>
    </div>
  </div>
</main>

<script src="data.js"></script>
<script>
document.getElementById('sidebar-root').innerHTML = renderSidebar('users');
document.getElementById('topbar-root').innerHTML = renderTopbar('Gestion des utilisateurs — المستخدمون');
setDate();

let localUsers = [...users];
let roleFilter = '';

function renderUsers(data) {
  const tb = document.getElementById('users-table');
  tb.innerHTML = data.map((u, i) => `
    <tr>
      <td class="bold"><div style="display:flex;align-items:center;gap:10px">
        <div class="av" style="background:${avBg(i)}">${initials(u.name)}</div>${u.name}
      </div></td>
      <td>${roleChip(u.role)}</td>
      <td class="mono">${u.cardId}</td>
      <td style="color:var(--c-text-3)">${u.group}</td>
      <td>${badgeHTML(u.status)}</td>
      <td><div style="display:flex;gap:6px">
        <button class="btn btn-outline btn-sm btn-icon" title="Modifier" onclick="editUser(${u.id})">
          <svg viewBox="0 0 24 24" fill="currentColor" style="width:14px;height:14px"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        </button>
        <button class="btn btn-danger btn-sm btn-icon" title="Supprimer" onclick="deleteUser(${u.id})">
          <svg viewBox="0 0 24 24" fill="currentColor" style="width:14px;height:14px"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
        </button>
      </div></td>
    </tr>`).join('');
  document.getElementById('users-count').textContent = data.length + ' utilisateurs';
}

function applyUsersFilter(q = '') {
  const data = localUsers.filter(u =>
    u.name.toLowerCase().includes(q.toLowerCase()) &&
    (roleFilter === '' || u.role === roleFilter)
  );
  renderUsers(data);
}

function filterUsers(q) { applyUsersFilter(q); }
function filterUsersRole(v) { roleFilter = v; applyUsersFilter(); }

function openModal() { document.getElementById('modal-add').classList.add('open'); }
function closeModal() { document.getElementById('modal-add').classList.remove('open'); }

function addUser() {
  const name = document.getElementById('f-name').value.trim();
  const cardId = document.getElementById('f-card').value.trim();
  const role = document.getElementById('f-role').value;
  const group = document.getElementById('f-group').value.trim() || '—';
  if (!name || !cardId) { alert('Veuillez remplir tous les champs obligatoires.'); return; }
  const newUser = { id: Date.now(), name, role, cardId, group, status: 'active' };
  localUsers.unshift(newUser);
  applyUsersFilter();
  closeModal();
  document.getElementById('f-name').value = '';
  document.getElementById('f-card').value = '';
  document.getElementById('f-email').value = '';
  document.getElementById('f-group').value = '';
}

function deleteUser(id) {
  if (confirm('Confirmer la suppression de cet utilisateur?')) {
    localUsers = localUsers.filter(u => u.id !== id);
    applyUsersFilter();
  }
}

function editUser(id) {
  const u = localUsers.find(u => u.id === id);
  if (!u) return;
  document.getElementById('f-name').value = u.name;
  document.getElementById('f-card').value = u.cardId;
  document.getElementById('f-group').value = u.group === '—' ? '' : u.group;
  document.getElementById('f-role').value = u.role;
  openModal();
}

renderUsers(localUsers);
</script>
</body>
</html>
