<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CArdPr — Tableau de bord</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="sidebar-root"></div>
<div id="topbar-root"></div>

<main class="main-content">
  <!-- STATS -->
  <div class="stats-grid">
    <div class="stat-card blue fade-up fade-up-1">
      <div class="stat-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg></div>
      <div class="stat-label">Total Inscrits / الإجمالي</div>
      <div class="stat-value">55</div>
      <div class="stat-sub">Formateurs + Stagiaires</div>
      <div class="stat-bar"><div class="stat-bar-fill" style="width:100%"></div></div>
    </div>
    <div class="stat-card green fade-up fade-up-2">
      <div class="stat-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg></div>
      <div class="stat-label">Présents / حاضرون</div>
      <div class="stat-value">42</div>
      <div class="stat-sub">76% du total</div>
      <div class="stat-bar"><div class="stat-bar-fill" style="width:76%"></div></div>
    </div>
    <div class="stat-card orange fade-up fade-up-3">
      <div class="stat-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg></div>
      <div class="stat-label">En retard / متأخرون</div>
      <div class="stat-value">8</div>
      <div class="stat-sub">15% du total</div>
      <div class="stat-bar"><div class="stat-bar-fill" style="width:15%"></div></div>
    </div>
    <div class="stat-card red fade-up fade-up-4">
      <div class="stat-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg></div>
      <div class="stat-label">Absents / غائبون</div>
      <div class="stat-value">5</div>
      <div class="stat-sub">9% du total</div>
      <div class="stat-bar"><div class="stat-bar-fill" style="width:9%"></div></div>
    </div>
  </div>

  <!-- TABLE -->
  <div class="card fade-up fade-up-5">
    <div class="card-header">
      <div>
        <div class="card-title">Présence en direct — الحضور المباشر</div>
        <div class="card-subtitle">Aujourd'hui, derniers pointages</div>
      </div>
      <div class="live-dot">En direct</div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Nom / الاسم</th><th>Rôle</th><th>Carte ID</th><th>Heure</th><th>Statut</th>
        </tr></thead>
        <tbody id="dash-table"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="data.js"></script>
<script>
document.getElementById('sidebar-root').innerHTML = renderSidebar('index');
document.getElementById('topbar-root').innerHTML = renderTopbar('Tableau de bord — لوحة التحكم');
setDate();

const tb = document.getElementById('dash-table');
tb.innerHTML = attendance.map((r,i) => `
  <tr>
    <td class="bold"><div style="display:flex;align-items:center;gap:10px">
      <div class="av" style="background:${avBg(i)}">${initials(r.name)}</div>${r.name}
    </div></td>
    <td>${roleChip(r.role)}</td>
    <td class="mono">${r.cardId}</td>
    <td>${r.time}</td>
    <td>${badgeHTML(r.status)}</td>
  </tr>`).join('');
</script>
</body>
</html>
