<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CArdPr — Présence en direct</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="sidebar-root"></div>
<div id="topbar-root"></div>

<main class="main-content">
  <div class="filter-row">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input class="search-input" type="text" placeholder="Rechercher par nom..." oninput="filterTable(this.value)"/>
    </div>
    <select class="filter-select" onchange="filterRole(this.value)">
      <option value="">Tous les rôles</option>
      <option value="Stagiaire">Stagiaire</option>
      <option value="Formateur">Formateur</option>
      <option value="Administrateur">Administrateur</option>
    </select>
    <select class="filter-select" onchange="filterStatus(this.value)">
      <option value="">Tous les statuts</option>
      <option value="present">Présent</option>
      <option value="late">En retard</option>
      <option value="absent">Absent</option>
    </select>
    <button class="btn btn-outline btn-sm">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      Exporter
    </button>
  </div>

  <div class="card">
    <div class="card-header">
      <div>
        <div class="card-title">Présence en direct — الحضور المباشر</div>
        <div class="card-subtitle">Mise à jour en temps réel · اليوم</div>
      </div>
      <div class="live-dot">En direct</div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Nom / الاسم</th>
          <th>Rôle</th>
          <th>Groupe</th>
          <th>Carte ID</th>
          <th>Heure d'arrivée</th>
          <th>Statut</th>
        </tr></thead>
        <tbody id="live-table"></tbody>
      </table>
    </div>
    <div class="pagination">
      <button class="page-btn active">1</button>
      <button class="page-btn">2</button>
      <button class="page-btn">3</button>
      <div class="page-info" id="live-count">7 résultats</div>
    </div>
  </div>
</main>

<script src="data.js"></script>
<script>
document.getElementById('sidebar-root').innerHTML = renderSidebar('live');
document.getElementById('topbar-root').innerHTML = renderTopbar('Présence en direct — الحضور المباشر');
setDate();

let roleFilter = '';
let statusFilter = '';

function render(data) {
  const tb = document.getElementById('live-table');
  tb.innerHTML = data.map((r, i) => `
    <tr>
      <td class="bold"><div style="display:flex;align-items:center;gap:10px">
        <div class="av" style="background:${avBg(i)}">${initials(r.name)}</div>${r.name}
      </div></td>
      <td>${roleChip(r.role)}</td>
      <td style="color:var(--c-text-3)">${r.group}</td>
      <td class="mono">${r.cardId}</td>
      <td class="mono">${r.time}</td>
      <td>${badgeHTML(r.status)}</td>
    </tr>`).join('');
  document.getElementById('live-count').textContent = data.length + ' résultats';
}

function applyFilters(q = '') {
  const data = attendance.filter(r =>
    r.name.toLowerCase().includes(q.toLowerCase()) &&
    (roleFilter === '' || r.role === roleFilter) &&
    (statusFilter === '' || r.status === statusFilter)
  );
  render(data);
}

function filterTable(q) { applyFilters(q); }
function filterRole(v) { roleFilter = v; applyFilters(); }
function filterStatus(v) { statusFilter = v; applyFilters(); }

render(attendance);
</script>
</body>
</html>
